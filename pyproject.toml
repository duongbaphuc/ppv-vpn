[project]
name = "ppv-vpn"
version = "1.1.4"
description = "Per-App Split-Tunneling WireGuard & WARP+ VPN for Windows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "cryptography>=42.0",
    "requests>=2.31",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PIE", "SIM"]
ignore = ["E501"]
